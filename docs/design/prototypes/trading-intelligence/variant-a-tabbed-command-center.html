<!doctype html>
<!--

<html lang="en">
<head>

<title>Trading Intelligence · Variant A — Tabbed Command Center</title>
<style>/* ==================================================================
 * Shared tokens — Trading Intelligence Control Plane prototypes
 * Palette slots follow the Hermes dataviz reference palette.
 * Status colours are RESERVED: never reused as a series colour.
 * ================================================================== */
:root {
  color-scheme: light;

  --plane:        #f9f9f7;
  --surface:      #fcfcfb;
  --surface-2:    #f2f1ed;
  --surface-sunk: #eeede8;

  --ink:          #0b0b0b;
  --ink-2:        #52514e;
  --ink-muted:    #898781;

  --rule:         #e1e0d9;
  --rule-strong:  #c3c2b7;

  --good:         #0ca30c;
  --warning:      #fab219;
  --serious:      #ec835a;
  --critical:     #d03b3b;

  --good-ink:     #046a04;
  --warning-ink:  #8a5c00;
  --serious-ink:  #a8461c;
  --critical-ink: #a02020;

  --good-wash:     rgba(12,163,12,.09);
  --warning-wash:  rgba(250,178,25,.14);
  --serious-wash:  rgba(236,131,90,.13);
  --critical-wash: rgba(208,59,59,.10);
  --neutral-wash:  rgba(11,11,11,.05);

  --series-1: #2a78d6;  /* investing-system */
  --series-2: #eb6834;  /* khashi-vc */

  --lock:      #4a3aa7;
  --lock-wash: rgba(74,58,167,.10);

  --shadow: 0 1px 2px rgba(11,11,11,.05), 0 8px 24px rgba(11,11,11,.06);

  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --plane:        #0d0d0d;
    --surface:      #1a1a19;
    --surface-2:    #212120;
    --surface-sunk: #131312;

    --ink:          #ffffff;
    --ink-2:        #c3c2b7;
    --ink-muted:    #898781;

    --rule:         #2c2c2a;
    --rule-strong:  #383835;

    --good-ink:     #4cc44c;
    --warning-ink:  #fab219;
    --serious-ink:  #ec835a;
    --critical-ink: #e86a6a;

    --good-wash:     rgba(12,163,12,.16);
    --warning-wash:  rgba(250,178,25,.16);
    --serious-wash:  rgba(236,131,90,.16);
    --critical-wash: rgba(208,59,59,.20);
    --neutral-wash:  rgba(255,255,255,.06);

    --series-1: #3987e5;
    --series-2: #d95926;

    --lock:      #9085e9;
    --lock-wash: rgba(144,133,233,.16);

    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.45);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --plane:        #0d0d0d;
  --surface:      #1a1a19;
  --surface-2:    #212120;
  --surface-sunk: #131312;
  --ink:          #ffffff;
  --ink-2:        #c3c2b7;
  --ink-muted:    #898781;
  --rule:         #2c2c2a;
  --rule-strong:  #383835;
  --good-ink:     #4cc44c;
  --warning-ink:  #fab219;
  --serious-ink:  #ec835a;
  --critical-ink: #e86a6a;
  --good-wash:     rgba(12,163,12,.16);
  --warning-wash:  rgba(250,178,25,.16);
  --serious-wash:  rgba(236,131,90,.16);
  --critical-wash: rgba(208,59,59,.20);
  --neutral-wash:  rgba(255,255,255,.06);
  --series-1: #3987e5;
  --series-2: #d95926;
  --lock:      #9085e9;
  --lock-wash: rgba(144,133,233,.16);
  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.45);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--plane);
  color: var(--ink);
  font: 13px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
}

/* ---- primitives shared by every variant ---------------------------- */
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); }

.eyebrow {
  font-size: 10px; font-weight: 700; letter-spacing: .09em;
  text-transform: uppercase; color: var(--ink-muted);
}

.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 7px; border-radius: 4px;
  font-size: 10.5px; font-weight: 700; letter-spacing: .05em;
  text-transform: uppercase; white-space: nowrap;
  border: 1px solid transparent;
}
.badge svg { width: 11px; height: 11px; flex: none; }

.t-ready    { background: var(--good-wash);     color: var(--good-ink);     border-color: rgba(12,163,12,.30); }
.t-watch    { background: var(--warning-wash);  color: var(--warning-ink);  border-color: rgba(250,178,25,.40); }
.t-blocked  { background: var(--critical-wash); color: var(--critical-ink); border-color: rgba(208,59,59,.35); }
.t-unavailable { background: var(--serious-wash); color: var(--serious-ink); border-color: rgba(236,131,90,.38); }
.t-unknown  { background: var(--neutral-wash);  color: var(--ink-2);        border-color: var(--rule); }
.t-lock     { background: var(--lock-wash);     color: var(--lock);         border-color: rgba(74,58,167,.30); }

.rail-ready { background: var(--good); }
.rail-watch { background: var(--warning); }
.rail-blocked { background: var(--critical); }
.rail-unavailable { background: var(--serious); }
.rail-unknown { background: var(--rule-strong); }

.btn {
  font: inherit; font-size: 12px; font-weight: 600;
  color: var(--ink); background: var(--surface);
  border: 1px solid var(--rule-strong); border-radius: 5px;
  padding: 5px 10px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { background: var(--surface-2); }
.btn:focus-visible { outline: 2px solid var(--series-1); outline-offset: 1px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn-danger { border-color: rgba(208,59,59,.5); color: var(--critical-ink); }
.btn-danger:hover { background: var(--critical-wash); }
.btn-primary { background: var(--series-1); border-color: var(--series-1); color: #fff; }
.btn-primary:hover { filter: brightness(1.07); background: var(--series-1); }

.safety-banner {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 12px; border-radius: 5px;
  background: var(--lock-wash); border: 1px solid rgba(74,58,167,.28);
  color: var(--lock); font-size: 12px; font-weight: 600;
}
.safety-banner svg { width: 14px; height: 14px; flex: none; }

/* skeletons */
@keyframes shimmer { 0%{opacity:.55} 50%{opacity:.9} 100%{opacity:.55} }
.sk { background: var(--surface-sunk); border-radius: 4px; animation: shimmer 1.4s ease-in-out infinite; }

/* dev-only state switcher — never ships in the real page */
.statebar {
  position: sticky; top: 0; z-index: 60;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 6px 14px;
  background: repeating-linear-gradient(135deg, var(--surface-sunk) 0 8px, var(--surface-2) 8px 16px);
  border-bottom: 1px solid var(--rule-strong);
  font-size: 11px;
}
.statebar strong { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }
.statebar button {
  font: inherit; font-size: 11px; padding: 3px 8px; cursor: pointer;
  border: 1px solid var(--rule-strong); border-radius: 4px;
  background: var(--surface); color: var(--ink-2);
}
.statebar button[aria-pressed="true"] { background: var(--ink); color: var(--plane); border-color: var(--ink); font-weight: 700; }
.statebar .spacer { flex: 1 1 auto; }

/* modal / drawer shell */
.scrim {
  position: fixed; inset: 0; z-index: 80;
  background: rgba(11,11,11,.45); backdrop-filter: blur(2px);
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.dialog {
  width: min(560px, 100%); max-height: 88vh; overflow: auto;
  background: var(--surface); border: 1px solid var(--rule-strong);
  border-radius: 8px; box-shadow: var(--shadow);
}
.dialog header { padding: 14px 16px; border-bottom: 1px solid var(--rule); }
.dialog .body { padding: 14px 16px; }
.dialog footer { padding: 12px 16px; border-top: 1px solid var(--rule); display: flex; gap: 8px; justify-content: flex-end; }

.kv { display: grid; grid-template-columns: 132px 1fr; gap: 4px 12px; font-size: 12px; }
.kv dt { color: var(--ink-muted); }
.kv dd { margin: 0; color: var(--ink); }

pre.payload {
  margin: 0; padding: 10px; border-radius: 5px; overflow: auto; max-height: 220px;
  background: var(--surface-sunk); border: 1px solid var(--rule);
  font-family: var(--mono); font-size: 11px; line-height: 1.5; color: var(--ink-2);
}

.empty {
  padding: 22px 14px; text-align: center; color: var(--ink-muted);
  font-size: 12px; border: 1px dashed var(--rule-strong); border-radius: 6px;
}

a { color: var(--series-1); }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--rule-strong); border-radius: 6px; border: 3px solid var(--plane); }


/* ---------- Variant A: tabbed command center ---------- */
.wrap { max-width: 1440px; margin: 0 auto; padding: 0 20px 48px; }

header.page {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap;
  padding: 14px 0 12px; margin-bottom: 14px;
  background: var(--plane); border-bottom: 1px solid var(--rule);
}
header.page .title { font-size: 20px; font-weight: 750; letter-spacing: -.01em; margin: 0; }
header.page .meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
header.page .right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.stamp { font-size: 11.5px; color: var(--ink-muted); }
.stamp.stale { color: var(--serious-ink); font-weight: 650; }

.ribbon { display: grid; grid-template-columns: repeat(8, 1fr); gap: 1px; background: var(--rule);
  border: 1px solid var(--rule); border-radius: 7px; overflow: hidden; margin-bottom: 14px; }
.kpi { background: var(--surface); padding: 9px 11px 10px; min-width: 0; }
.kpi .l { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .v { font-size: 21px; font-weight: 700; letter-spacing: -.02em; margin-top: 3px; line-height: 1.1; }
.kpi .v.nodata { font-size: 13px; font-weight: 600; color: var(--ink-muted); padding: 5px 0 4px; }
.kpi .n { font-size: 10.5px; color: var(--ink-muted); margin-top: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi.tone-blocked { box-shadow: inset 3px 0 0 var(--critical); }
.kpi.tone-ready { box-shadow: inset 3px 0 0 var(--good); }
.pnl-up { color: var(--good-ink); } .pnl-down { color: var(--critical-ink); }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 7px; overflow: hidden; }
.card > .hd { display: flex; align-items: center; gap: 9px; padding: 10px 12px; border-bottom: 1px solid var(--rule); }
.card > .bd { padding: 11px 12px; }
.card.accent-ready { border-left: 3px solid var(--good); }
.card.accent-watch { border-left: 3px solid var(--warning); }
.card.accent-blocked { border-left: 3px solid var(--critical); }
.card.accent-unavailable { border-left: 3px solid var(--serious); background: var(--serious-wash); }
.card.accent-unknown { border-left: 3px solid var(--rule-strong); }
.card .name { font-size: 14px; font-weight: 700; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

.probe { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11px; color: var(--ink-muted); margin-bottom: 9px; }
.probe b { color: var(--ink-2); font-weight: 650; }

.minikpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--rule);
  border: 1px solid var(--rule); border-radius: 5px; overflow: hidden; margin-bottom: 10px; }
.minikpis > div { background: var(--surface); padding: 7px 9px; }
.minikpis .l { font-size: 9.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-muted); }
.minikpis .v { font-size: 15px; font-weight: 700; margin-top: 1px; }

ul.reasons { list-style: none; margin: 0; padding: 0; }
ul.reasons li { display: flex; gap: 7px; padding: 5px 0; border-top: 1px solid var(--rule); font-size: 12px; line-height: 1.45; }
ul.reasons li:first-child { border-top: 0; }
ul.reasons .mk { flex: none; width: 3px; border-radius: 2px; align-self: stretch; }
.sect-l { font-size: 10px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
  color: var(--ink-muted); margin: 10px 0 5px; }

nav.tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--rule-strong); margin-bottom: 14px; }
nav.tabs button { font: inherit; font-size: 12.5px; font-weight: 600; white-space: nowrap;
  background: none; border: 0; border-bottom: 2px solid transparent; color: var(--ink-muted);
  padding: 8px 12px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
nav.tabs button:hover { color: var(--ink); }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
nav.tabs .pip { width: 6px; height: 6px; border-radius: 50%; }

.split { display: grid; grid-template-columns: minmax(0,1fr) 372px; gap: 14px; align-items: start; }
.evrow { display: grid; grid-template-columns: 3px 58px 1fr; gap: 9px; padding: 8px 0; border-top: 1px solid var(--rule); }
.evrow:first-child { border-top: 0; }
.evrow .mk { border-radius: 2px; }
.evrow .t { font-size: 10.5px; color: var(--ink-muted); font-variant-numeric: tabular-nums; padding-top: 1px; }
.evrow .ttl { font-size: 12.5px; font-weight: 650; }
.evrow .sm { font-size: 11.5px; color: var(--ink-2); margin-top: 2px; line-height: 1.4; }
.evrow .tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px; }
.tag { font-size: 9.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
  padding: 1px 5px; border-radius: 3px; background: var(--neutral-wash); color: var(--ink-2); }
.tag.inv { background: rgba(42,120,214,.13); color: var(--series-1); }
.tag.kha { background: rgba(235,104,52,.14); color: var(--series-2); }

.chips { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
.chip { font: inherit; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 20px;
  border: 1px solid var(--rule-strong); background: var(--surface); color: var(--ink-2); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--plane); border-color: var(--ink); }

table.data { width: 100%; border-collapse: collapse; font-size: 12px; }
table.data th { text-align: left; font-size: 10px; letter-spacing: .06em; text-transform: uppercase;
  color: var(--ink-muted); font-weight: 700; padding: 6px 9px; border-bottom: 1px solid var(--rule-strong); }
table.data td { padding: 7px 9px; border-bottom: 1px solid var(--rule); vertical-align: top; }
table.data tr:last-child td { border-bottom: 0; }
table.data td.n { text-align: right; font-variant-numeric: tabular-nums; }

.ctlgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(276px, 1fr)); gap: 10px; }
.ctl { border: 1px solid var(--rule); border-radius: 6px; padding: 10px 11px; background: var(--surface);
  display: flex; flex-direction: column; gap: 7px; }
.ctl.risk-blocked { border-color: rgba(208,59,59,.35); background: var(--critical-wash); }
.ctl .lab { font-size: 13px; font-weight: 700; }
.ctl .it { font-size: 11.5px; color: var(--ink-2); line-height: 1.4; flex: 1; }
.ctl code { font-size: 10.5px; }

.meter { height: 5px; background: var(--surface-sunk); border-radius: 3px; overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: 3px; background: var(--series-1); }

@media (max-width: 1180px) { .ribbon { grid-template-columns: repeat(4, 1fr); } .split { grid-template-columns: 1fr; } }
@media (max-width: 760px) { .ribbon { grid-template-columns: repeat(2, 1fr); } .grid2 { grid-template-columns: 1fr; } .wrap { padding: 0 12px 40px; } }
</style>
</head>

<div id="root"></div>
<script>/* ------------------------------------------------------------------

<script>/* ==================================================================
 * Shared helpers — Trading Intelligence Control Plane prototypes
 * ================================================================== */
const H = (() => {
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "html") n.innerHTML = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2).toLowerCase(), v);
      else n.setAttribute(k, v === true ? "" : String(v));
    }
    for (const kid of kids.flat()) {
      if (kid == null || kid === false) continue;
      n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    }
    return n;
  };

  /* --- formatting -------------------------------------------------
     null / undefined must read "No data", NEVER 0 (handoff §7).
     A real 0 must read "0". These are different answers. */
  const NO_DATA = "No data";
  const isNum = (v) => typeof v === "number" && Number.isFinite(v);

  const fmtInt = (v) => (isNum(v) ? v.toLocaleString("en-US") : NO_DATA);
  const fmtCurrency = (v) =>
    isNum(v)
      ? (v < 0 ? "−" : "") + "$" + Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })
      : NO_DATA;
  const fmtPct = (v) => (isNum(v) ? `${v.toFixed(1)}%` : NO_DATA);
  const fmtRatio = (a, b) => (isNum(a) && isNum(b) ? `${a}/${b}` : NO_DATA);

  /* Only signed P/L gets up/down colour. Risk, exposure and counts must
     stay neutral — green on "open risk $260" would read as "good". */
  const pnlTone = (v) => (!isNum(v) ? "" : v > 0 ? "pnl-up" : v < 0 ? "pnl-down" : "pnl-flat");
  const isSignedPnl = (key) => /pnl/i.test(String(key)) && !/risk/i.test(String(key));

  /* camelCase field name -> readable label, raw key kept as the tooltip. */
  const humanize = (key) =>
    String(key)
      .replace(/([a-z0-9])([A-Z])/g, "$1 $2")
      .replace(/\bPnl\b/gi, "P/L")
      .replace(/\bPct\b/gi, "%")
      .replace(/\bUsd\b/gi, "USD")
      .replace(/^./, (c) => c.toUpperCase());

  const relTime = (iso) => {
    const t = new Date(iso).getTime();
    if (Number.isNaN(t)) return "unknown";
    const s = Math.max(0, Math.round((Date.now() - t) / 1000));
    if (s < 45) return "just now";
    if (s < 3600) return `${Math.round(s / 60)}m ago`;
    if (s < 86400) return `${Math.round(s / 3600)}h ago`;
    return `${Math.round(s / 86400)}d ago`;
  };
  const clockTime = (iso) => {
    const d = new Date(iso);
    return Number.isNaN(d.getTime()) ? "--:--:--" : d.toTimeString().slice(0, 8);
  };
  /* Staleness: generatedAt older than the poll window means the numbers
     on screen are not what the fleet looks like now. */
  const isStale = (iso, seconds = 120) => (Date.now() - new Date(iso).getTime()) / 1000 > seconds;

  /* --- status ------------------------------------------------------
     _normalize_project_status passes unmatched source strings straight
     through, so `status` is an open string, not a 4-value union. */
  const KNOWN = ["ready", "watch", "blocked", "unavailable"];
  const tone = (status) => (KNOWN.includes(String(status)) ? String(status) : "unknown");
  const toneClass = (status) => `t-${tone(status)}`;
  const railClass = (status) => `rail-${tone(status)}`;

  const ICON = {
    ready: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8.5l3.2 3.2L13 5"/></svg>',
    watch: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 2.5l6 11H2z"/><path d="M8 6.6v3"/><path d="M8 11.4v.1"/></svg>',
    blocked: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="8" r="5.7"/><path d="M4 12L12 4"/></svg>',
    unavailable: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="8" r="5.7"/><path d="M8 5v4"/><path d="M8 11v.1"/></svg>',
    unknown: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="8" r="5.7"/><path d="M6.3 6.4a1.8 1.8 0 113 1.4v.7"/><path d="M8 11v.1"/></svg>',
    lock: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="10" height="7" rx="1.6"/><path d="M5.6 7V5.2a2.4 2.4 0 014.8 0V7"/></svg>',
  };

  /* Status is never colour-alone: every badge carries an icon + the word. */
  const statusBadge = (status, extra = "") =>
    el("span", { class: `badge ${toneClass(status)}`, title: `status: ${status}`, html: `${ICON[tone(status)]}<span>${status}${extra}</span>` });

  const lockBadge = (locked) =>
    locked
      ? el("span", { class: "badge t-lock", html: `${ICON.lock}<span>Live trading locked</span>` })
      : el("span", { class: "badge t-watch", html: `${ICON.watch}<span>Live trading UNLOCKED</span>` });

  /* --- events ------------------------------------------------------ */
  const SEV_ORDER = { critical: 0, error: 1, warning: 2, info: 3 };
  /* §9: source_unavailable renders critical even when the source's own
     severity disagrees. */
  const eventSeverity = (ev) => (ev.type === "source_unavailable" ? "critical" : String(ev.severity || "info"));
  const sevTone = (sev) =>
    ({ critical: "blocked", error: "blocked", warning: "watch", info: "unknown" }[sev] || "unknown");
  const sevRail = (sev) =>
    ({ critical: "rail-blocked", error: "rail-blocked", warning: "rail-watch", info: "rail-unknown" }[sev] || "rail-unknown");

  const EVENT_FILTERS = [
    { id: "all", label: "All", test: () => true },
    { id: "investing-system", label: "Investing System", test: (e) => e.sourceProject === "investing-system" },
    { id: "khashi-vc", label: "Khashi VC", test: (e) => e.sourceProject === "khashi-vc" },
    { id: "warnings", label: "Warnings", test: (e) => eventSeverity(e) === "warning" },
    { id: "errors", label: "Errors", test: (e) => ["error", "critical"].includes(eventSeverity(e)) },
    { id: "trades", label: "Trades", test: (e) => /trade|execution|lifecycle|paper/i.test(`${e.stream} ${e.type}`) },
    { id: "controls", label: "Controls", test: (e) => /control/i.test(`${e.stream} ${e.type}`) },
    { id: "strategy", label: "Strategy", test: (e) => /strategy|exit|indicator|shadow/i.test(`${e.stream} ${e.type}`) },
    { id: "source-health", label: "Source Health", test: (e) => /source|health|freshness|collection/i.test(`${e.stream} ${e.type}`) },
  ];

  /* --- controls ----------------------------------------------------
     Neither source emits riskLevel or requiresConfirmation, so derive
     both from the fields that ARE published. */
  const riskLevel = (c) => {
    if (c.brokerMutation) return "critical";
    if (c.id === "emergency_lock_trading") return "critical";
    if (c.dangerous || c.requiresServiceRestart) return "high";
    if (c.execution === "host_orchestrator_required" || c.execution === "runbook-required") return "medium";
    return "low";
  };
  const riskTone = (r) => ({ critical: "blocked", high: "blocked", medium: "watch", low: "ready" }[r] || "unknown");
  const requiresConfirmation = (c) => riskLevel(c) !== "low";

  /* Preview-first: the first request is always execute:false (§13). */
  const buildRequest = (c, { execute, reason }) => ({
    action: c.namespacedId,
    execute,
    reason,
    actorId: "nous-dashboard-operator",
    correlationId: `ti-${Date.now().toString(36)}`,
  });

  const mockControlResponse = (c, req) => ({
    id: "trading-intelligence-control-plane-control",
    contractVersion: "trading-intelligence-control-plane.v1",
    generatedAt: new Date().toISOString(),
    status: "proxied",
    projectId: c.projectId,
    action: c.id,
    httpStatus: 200,
    sourceBaseUrl: c.projectId === "khashi-vc" ? "http://khashi:3101" : "http://investing-system:3102",
    error: null,
    result: {
      projectId: c.projectId,
      status: req.execute ? "recorded" : "preview",
      action: c.id,
      execute: req.execute,
      liveTradingLocked: true,
      brokerMutation: false,
      runbookCommand: c.runbookCommand ?? null,
      effect: c.effect ?? null,
      nextAction: req.execute
        ? c.runbookCommand
          ? `Run ${c.runbookCommand} on the production host and restart the project service if required.`
          : "Operator request recorded to the project ledger."
        : "Submit with execute=true to record an auditable operator request.",
    },
  });

  /* Never claim success on transport alone (§20). */
  const executionSucceeded = (res) =>
    res.status === "proxied" &&
    res.httpStatus >= 200 && res.httpStatus < 300 &&
    !!res.result &&
    !["rejected", "failed", "error"].includes(String(res.result.status));

  /* --- KPI ribbon definition (shared across variants) --------------- */
  const kpiCards = (k) => [
    { label: "Projects available", value: fmtRatio(k.projectsAvailable, k.projectsTotal), tone: k.projectsAvailable === k.projectsTotal ? "ready" : "blocked", note: "sources reachable" },
    { label: "Open trades", value: fmtInt(k.openTrades), note: "both systems" },
    { label: "Closed / reviewed", value: fmtInt(k.closedTrades), note: "closedTrades ∪ reviewedTrades" },
    { label: "Realized P/L", value: fmtCurrency(k.realizedPnlUsd), pnl: k.realizedPnlUsd, note: "today, attributed" },
    { label: "Open risk", value: fmtCurrency(k.openRiskUsd), note: "khashi-vc only" },
    { label: "Live markets", value: fmtInt(k.liveMarkets), note: "khashi-vc only" },
    { label: "Strategy candidates", value: fmtInt(k.strategyCandidates), note: "paper candidates" },
    { label: "Blockers", value: fmtInt(k.blockers), tone: k.blockers > 0 ? "blocked" : "ready", note: "across the fleet" },
  ];

  const projectColor = (id) => (id === "investing-system" ? "var(--series-1)" : "var(--series-2)");
  const projectShort = (id) => (id === "investing-system" ? "INV" : id === "khashi-vc" ? "KHA" : "SRC");

  /* --- dev-only state switcher ------------------------------------- */
  const STATES = [
    ["ready", "Loaded"],
    ["loading", "Loading"],
    ["degraded", "One source down"],
    ["empty", "Empty"],
    ["error", "Summary error"],
  ];

  function stateBar(current, onChange, variantName) {
    const bar = el("div", { class: "statebar" }, el("strong", {}, "Prototype state"));
    for (const [id, label] of STATES) {
      bar.append(el("button", { type: "button", "aria-pressed": String(id === current), onclick: () => onChange(id) }, label));
    }
    bar.append(el("span", { class: "spacer" }));
    bar.append(el("strong", {}, variantName));
    bar.append(
      el("button", {
        type: "button",
        onclick: () => {
          const root = document.documentElement;
          const dark = root.getAttribute("data-theme") === "dark" ||
            (!root.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
          root.setAttribute("data-theme", dark ? "light" : "dark");
        },
      }, "Toggle theme")
    );
    return bar;
  }

  /* Resolve the fixture for a given prototype state. */
  function dataFor(state) {
    if (state === "error") return { summary: null, events: TI.events, controls: TI.controls, error: "Summary failed: 500" };
    if (state === "degraded") return { summary: TI.degradedSummary, events: { ...TI.events, events: [
      { id: "nous-inv-unavail", sourceProject: "investing-system", sourceSystem: "nous-hermes-agent", stream: "source-health", type: "source_unavailable", status: "blocked", severity: "info", title: "Investing System unavailable", occurredAt: new Date().toISOString(), instrument: null, summary: "Source command-center endpoint did not respond.", links: { summary: "/trading-desk/command-center/summary" }, rawRef: { baseUrls: ["http://investing-system:3102", "http://127.0.0.1:3102"] } },
      ...TI.events.events.filter((e) => e.sourceProject === "khashi-vc"),
    ] }, controls: { ...TI.controls, projects: TI.controls.projects.map((p) => p.projectId === "investing-system" ? { ...p, available: false, error: "source_unavailable", controls: [] } : p), controls: TI.controls.controls.filter((c) => c.projectId === "khashi-vc") }, error: null };
    if (state === "empty") return { summary: { ...TI.summary, blockers: [], recommendations: [], status: "ready", kpis: { ...TI.summary.kpis, blockers: 0, openTrades: 0, closedTrades: 0, realizedPnlUsd: null, openRiskUsd: null, strategyCandidates: null } }, events: { ...TI.events, events: [] }, controls: { ...TI.controls, projects: TI.controls.projects.map((p) => ({ ...p, controls: [] })), controls: [] }, error: null };
    return { summary: TI.summary, events: TI.events, controls: TI.controls, error: null };
  }

  return {
    el, NO_DATA, isNum, fmtInt, fmtCurrency, fmtPct, fmtRatio, pnlTone,
    isSignedPnl, humanize,
    relTime, clockTime, isStale, tone, toneClass, railClass, ICON,
    statusBadge, lockBadge, SEV_ORDER, eventSeverity, sevTone, sevRail, EVENT_FILTERS,
    riskLevel, riskTone, requiresConfirmation, buildRequest, mockControlResponse, executionSucceeded,
    kpiCards, projectColor, projectShort, STATES, stateBar, dataFor,
  };
})();

/* ==================================================================
 * Control confirmation dialog — preview-first, shared by all variants.
 * ================================================================== */
function openControlDialog(control, onDone) {
  const { el } = H;
  const risk = H.riskLevel(control);
  let preview = null;
  let executed = null;
  let reason = "";

  const scrim = el("div", { class: "scrim", onclick: (e) => { if (e.target === scrim) close(); } });
  const body = el("div", { class: "body" });
  const foot = el("footer");
  const dialog = el("div", { class: "dialog", role: "dialog", "aria-modal": "true", "aria-label": `Control: ${control.label}` },
    el("header", {},
      el("div", { style: "display:flex;align-items:center;gap:8px;flex-wrap:wrap" },
        el("span", { class: "eyebrow" }, control.projectLabel),
        el("span", { class: `badge t-${H.riskTone(risk)}`, html: `${H.ICON[H.riskTone(risk)] || H.ICON.unknown}<span>${risk} risk</span>` }),
        control.requiresServiceRestart ? el("span", { class: "badge t-watch", html: `${H.ICON.watch}<span>service restart</span>` }) : null,
        el("span", { class: "badge t-lock", html: `${H.ICON.lock}<span>live locked</span>` })
      ),
      el("div", { style: "font-size:16px;font-weight:700;margin-top:6px" }, control.label),
      el("code", { class: "mono", style: "font-size:11px;color:var(--ink-muted)" }, control.namespacedId)
    ),
    body, foot);

  function render() {
    body.replaceChildren();
    body.append(el("p", { style: "margin:0 0 12px;color:var(--ink-2)" }, control.intent || control.description || ""));

    const kv = el("dl", { class: "kv" });
    const rows = [
      ["Execution", control.execution || "—"],
      ["Broker mutation", control.brokerMutation ? "possible" : "no"],
      ["Live trading", "locked"],
      ["Confirmation", H.requiresConfirmation(control) ? "required" : "not required"],
    ];
    if (control.effect) rows.push(["Effect", control.effect]);
    if (control.runbookCommand) rows.push(["Runbook", el("code", { class: "mono" }, control.runbookCommand)]);
    for (const [k, v] of rows) { kv.append(el("dt", {}, k), el("dd", {}, v)); }
    body.append(kv);

    body.append(el("label", { style: "display:block;margin:14px 0 5px", class: "eyebrow" }, "Reason (sent with the request)"));
    const ta = el("textarea", {
      rows: 2,
      placeholder: "Why are you running this? Recorded on the project ledger.",
      style: "width:100%;font:inherit;font-size:12px;padding:7px 8px;border:1px solid var(--rule-strong);border-radius:5px;background:var(--surface);color:var(--ink);resize:vertical",
      oninput: (e) => { reason = e.target.value; sync(); },
    });
    ta.value = reason;
    body.append(ta);

    if (preview) {
      body.append(el("div", { class: "eyebrow", style: "margin:14px 0 5px" }, "Preview response · execute:false"));
      body.append(el("pre", { class: "payload" }, JSON.stringify(preview, null, 2)));
    }
    if (executed) {
      const ok = H.executionSucceeded(executed);
      body.append(el("div", { style: "margin:14px 0 5px;display:flex;align-items:center;gap:8px" },
        el("span", { class: "eyebrow" }, "Execute response"),
        el("span", { class: `badge t-${ok ? "ready" : "blocked"}`, html: `${ok ? H.ICON.ready : H.ICON.blocked}<span>${ok ? "proxied + source confirmed" : "not confirmed"}</span>` })
      ));
      body.append(el("pre", { class: "payload" }, JSON.stringify(executed, null, 2)));
    }
    sync();
  }

  function sync() {
    foot.replaceChildren();
    foot.append(el("span", { style: "flex:1;font-size:11px;color:var(--ink-muted)" },
      executed ? "Refresh /summary, /events and /controls after completion." :
      preview ? "Preview returned. Confirm to send execute:true." : "Step 1 of 2 — preview first."));
    foot.append(el("button", { class: "btn", type: "button", onclick: close }, executed ? "Close" : "Cancel"));
    if (!preview) {
      foot.append(el("button", { class: "btn btn-primary", type: "button", onclick: () => { preview = H.mockControlResponse(control, H.buildRequest(control, { execute: false, reason })); render(); } }, "Preview"));
    } else if (!executed) {
      foot.append(el("button", {
        class: `btn ${risk === "low" ? "btn-primary" : "btn-danger"}`, type: "button",
        disabled: H.requiresConfirmation(control) && reason.trim().length < 8,
        title: H.requiresConfirmation(control) && reason.trim().length < 8 ? "A reason of at least 8 characters is required for this risk level" : "",
        onclick: () => { executed = H.mockControlResponse(control, H.buildRequest(control, { execute: true, reason })); render(); onDone && onDone(control, executed); },
      }, `Execute ${control.label}`));
    }
  }

  function close() { scrim.remove(); document.removeEventListener("keydown", esc); }
  function esc(e) { if (e.key === "Escape") close(); }
  document.addEventListener("keydown", esc);

  scrim.append(dialog);
  document.body.append(scrim);
  render();
  return scrim;
}
</script>
<script>
const { el } = H;
let state = "ready";
let tab = "overview";
let evFilter = "all";
const log = [];

function render() {
  const d = H.dataFor(state);
  const root = document.getElementById("root");
  root.replaceChildren();
  root.append(H.stateBar(state, (s) => { state = s; tab = "overview"; render(); }, "Variant A · Tabbed Command Center"));

  const wrap = el("div", { class: "wrap" });
  root.append(wrap);

  if (state === "loading") { wrap.append(skeleton()); return; }
  if (d.error) { wrap.append(errorShell(d.error)); return; }

  const s = d.summary;
  wrap.append(pageHeader(s));
  wrap.append(el("div", { class: "safety-banner", style: "margin-bottom:14px", html:
    `${H.ICON.lock}<span>Live trading is locked. This page can inspect systems and proxy approved controls, but it cannot submit live broker orders.</span>` }));
  wrap.append(ribbon(s.kpis));
  wrap.append(projectCards(s));
  wrap.append(tabsNav(s));
  wrap.append(tabBody(s, d));
}

function pageHeader(s) {
  const stale = H.isStale(s.generatedAt, 90);
  return el("header", { class: "page" },
    el("div", {},
      el("h1", { class: "title" }, "Trading Intelligence"),
      el("div", { class: "meta" },
        H.statusBadge(s.status),
        H.lockBadge(s.liveTradingLocked),
        el("span", { class: `stamp${stale ? " stale" : ""}` },
          `Last updated ${H.relTime(s.generatedAt)}${stale ? " — stale" : ""} · ${H.clockTime(s.generatedAt)}`),
        el("span", { class: "stamp mono" }, s.frontendContractVersion)
      )
    ),
    el("div", { class: "right" },
      el("button", { class: "btn", type: "button", onclick: render },
        el("span", { html: '<svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M13.5 8a5.5 5.5 0 11-1.7-4"/><path d="M13.8 1.6V4.4H11"/></svg>' }),
        "Refresh")
    )
  );
}

function ribbon(k) {
  const r = el("div", { class: "ribbon" });
  for (const c of H.kpiCards(k)) {
    const nodata = c.value === H.NO_DATA;
    r.append(el("div", { class: `kpi${c.tone ? " tone-" + c.tone : ""}` },
      el("div", { class: "l", title: c.label }, c.label),
      el("div", { class: `v num ${nodata ? "nodata" : ""} ${c.pnl !== undefined ? H.pnlTone(c.pnl) : ""}` }, c.value),
      el("div", { class: "n", title: c.note }, c.note)
    ));
  }
  return r;
}

function projectCards(s) {
  const g = el("div", { class: "grid2" });
  for (const p of s.projects) g.append(projectCard(p));
  return g;
}

function projectCard(p) {
  const topKpis = Object.entries(p.kpis || {})
    .filter(([, v]) => typeof v === "number")
    .slice(0, 3);
  const c = el("div", { class: `card accent-${H.tone(p.status)}` },
    el("div", { class: "hd" },
      el("span", { class: "dot", style: `background:${H.projectColor(p.projectId)}` }),
      el("span", { class: "name" }, p.label),
      el("span", { style: "margin-left:auto;display:flex;gap:6px;align-items:center" },
        H.statusBadge(p.available ? p.status : "unavailable"),
        p.liveTradingLocked ? el("span", { class: "badge t-lock", html: `${H.ICON.lock}<span>locked</span>` }) : null)
    )
  );
  const bd = el("div", { class: "bd" });
  bd.append(el("div", { class: "probe" },
    el("span", {}, "HTTP ", el("b", { class: "num" }, String(p.httpStatus || 0))),
    el("span", {}, "Latency ", el("b", { class: "num" }, `${p.latencyMs} ms`)),
    el("span", { class: "mono", title: p.sourceBaseUrl || "" }, p.sourceBaseUrl || "no base url")
  ));

  if (!p.available) {
    bd.append(el("div", { class: "empty", style: "text-align:left" },
      el("div", { style: "font-weight:700;color:var(--serious-ink);margin-bottom:4px" }, "Source unavailable — this stream is missing, not empty."),
      el("code", { class: "mono", style: "font-size:11px" }, p.error || "no error text")));
  } else if (topKpis.length) {
    const mk = el("div", { class: "minikpis" });
    for (const [key, v] of topKpis) {
      mk.append(el("div", { title: key },
        el("div", { class: "l" }, H.humanize(key)),
        el("div", { class: `v num ${H.isSignedPnl(key) ? H.pnlTone(v) : ""}` }, H.isSignedPnl(key) || /risk/i.test(key) ? H.fmtCurrency(v) : H.fmtInt(v))));
    }
    bd.append(mk);
    if (typeof p.kpis.learningProgressPct === "number") {
      bd.append(el("div", { class: "sect-l" }, `Learning sample ${H.fmtPct(p.kpis.learningProgressPct)}`));
      bd.append(el("div", { class: "meter" }, el("i", { style: `width:${Math.min(100, p.kpis.learningProgressPct)}%` })));
    }
  }

  if (p.blockers.length) {
    bd.append(el("div", { class: "sect-l" }, `Blockers · ${p.blockers.length}`));
    bd.append(reasons(p.blockers.slice(0, 3), "var(--critical)"));
  }
  if (p.recommendations.length) {
    bd.append(el("div", { class: "sect-l" }, "Recommended next"));
    bd.append(reasons(p.recommendations.slice(0, 2), "var(--series-1)"));
  }
  bd.append(el("div", { class: "sect-l" }, "Source routes"));
  bd.append(el("div", { style: "display:flex;gap:5px;flex-wrap:wrap" },
    Object.entries(p.sourceRoutes || {}).slice(0, 5).map(([k2, v]) =>
      el("span", { class: "tag mono", title: v }, k2))));
  c.append(bd);
  return c;
}

function reasons(items, color) {
  const ul = el("ul", { class: "reasons" });
  for (const t of items) ul.append(el("li", {}, el("span", { class: "mk", style: `background:${color}` }), el("span", {}, t)));
  return ul;
}

function tabsNav(s) {
  const n = el("nav", { class: "tabs" });
  for (const t of s.tabs) {
    n.append(el("button", { type: "button", role: "tab", "aria-selected": String(t.id === tab), onclick: () => { tab = t.id; render(); } },
      el("span", { class: `pip ${H.railClass(t.status)}`, title: t.status }),
      t.label));
  }
  return n;
}

function tabBody(s, d) {
  const box = el("section", {});
  if (tab === "overview") {
    const sp = el("div", { class: "split" });
    const left = el("div", {});
    left.append(panel(`Needs attention · ${s.blockers.length}`, s.blockers.length
      ? reasons(s.blockers, "var(--critical)")
      : el("div", { class: "empty" }, "No blockers reported across the fleet.")));
    left.append(el("div", { style: "height:12px" }));
    left.append(panel("Recommended next actions", s.recommendations.length
      ? reasons(s.recommendations, "var(--series-1)")
      : el("div", { class: "empty" }, "No recommendations reported.")));
    sp.append(left, panel("Latest events", eventsList(d.events.events.slice(0, 5))));
    box.append(sp);
  } else if (tab === "investing-system" || tab === "khashi-vc") {
    const p = s.projects.find((x) => x.projectId === tab);
    box.append(projectDetail(p, d));
  } else if (tab === "pnl-risk") {
    box.append(pnlRisk(s));
  } else if (tab === "strategy-quality") {
    box.append(strategy(s, d));
  } else if (tab === "events") {
    box.append(eventsTab(d));
  } else if (tab === "controls") {
    box.append(controlsTab(d));
  }
  return box;
}

function panel(title, node) {
  return el("div", { class: "card" }, el("div", { class: "hd" }, el("span", { class: "name" }, title)), el("div", { class: "bd" }, node));
}

function projectDetail(p, d) {
  if (!p) return el("div", { class: "empty" }, "Project not present in this summary.");
  const box = el("div", {});
  box.append(projectCard(p));
  box.append(el("div", { style: "height:12px" }));
  const rows = Object.entries(p.kpis || {});
  box.append(panel(`${p.label} — published KPIs`, rows.length ? kvTable(rows) : el("div", { class: "empty" }, "No KPIs published while the source is unavailable.")));
  box.append(el("div", { style: "height:12px" }));
  box.append(panel(`${p.label} — source tabs`, (p.tabs || []).length
    ? el("div", { style: "display:flex;gap:6px;flex-wrap:wrap" }, (p.tabs || []).map((t) =>
        el("span", { class: `badge ${H.toneClass(t.status)}`, html: `${H.ICON[H.tone(t.status)]}<span>${t.label || t.id}</span>` })))
    : el("div", { class: "empty" }, "No source tabs published.")));
  box.append(el("div", { style: "height:12px" }));
  const det = el("details", {}, el("summary", { style: "cursor:pointer;font-size:12px;font-weight:650;padding:4px 0" }, "Raw project payload (debug)"),
    el("pre", { class: "payload", style: "margin-top:8px" }, JSON.stringify(p.summary, null, 2)));
  box.append(panel("Raw payload", det));
  return box;
}

function kvTable(rows) {
  const t = el("table", { class: "data" }, el("thead", {}, el("tr", {}, el("th", {}, "Field"), el("th", { style: "text-align:right" }, "Value"))));
  const tb = el("tbody", {});
  for (const [k, v] of rows) {
    tb.append(el("tr", {}, el("td", { title: k }, H.humanize(k), el("span", { class: "mono", style: "color:var(--ink-muted);margin-left:6px;font-size:10.5px" }, k)),
      el("td", { class: "n" }, typeof v === "boolean" ? (v ? "true" : "false") : typeof v === "number" ? H.fmtInt(v) : String(v ?? H.NO_DATA))));
  }
  t.append(tb); return t;
}

function pnlRisk(s) {
  const box = el("div", {});
  box.append(ribbon({ ...s.kpis, liveMarkets: s.kpis.liveMarkets, strategyCandidates: s.kpis.strategyCandidates }));
  const t = el("table", { class: "data" },
    el("thead", {}, el("tr", {}, el("th", {}, "Project"), el("th", { style: "text-align:right" }, "Open trades"),
      el("th", { style: "text-align:right" }, "Closed"), el("th", { style: "text-align:right" }, "Realized P/L"),
      el("th", { style: "text-align:right" }, "Open risk"))));
  const tb = el("tbody", {});
  for (const p of s.projects) {
    const k = p.kpis || {};
    const pnl = H.isNum(k.realizedPnlUsd) ? k.realizedPnlUsd : H.isNum(k.realizedPnlToday) ? k.realizedPnlToday : null;
    tb.append(el("tr", {},
      el("td", {}, el("span", { class: "dot", style: `display:inline-block;margin-right:6px;background:${H.projectColor(p.projectId)}` }), p.label),
      el("td", { class: "n" }, H.fmtInt(k.openTrades)),
      el("td", { class: "n" }, H.fmtInt(H.isNum(k.closedTrades) ? k.closedTrades : k.reviewedTrades)),
      el("td", { class: `n ${H.pnlTone(pnl)}` }, H.fmtCurrency(pnl)),
      el("td", { class: "n" }, H.fmtCurrency(k.openRiskUsd))));
  }
  t.append(tb);
  box.append(panel("Per-project P/L and risk", t));
  box.append(el("div", { style: "height:12px" }));
  box.append(panel("Contract note", el("p", { style: "margin:0;font-size:12px;color:var(--ink-2)" },
    "investing-system publishes no openRiskUsd and no closedTrades — it publishes reviewedTrades and realizedPnlToday. Blank cells here are missing fields in the source contract, not zero values.")));
  return box;
}

function strategy(s, d) {
  const box = el("div", {});
  const g = el("div", { class: "grid2" });
  for (const p of s.projects) {
    const k = p.kpis || {};
    const bd = el("div", {});
    if (H.isNum(k.learningProgressPct)) {
      bd.append(el("div", { class: "sect-l" }, `Learning sample progress ${H.fmtPct(k.learningProgressPct)}`));
      bd.append(el("div", { class: "meter" }, el("i", { style: `width:${Math.min(100, k.learningProgressPct)}%` })));
      bd.append(el("div", { style: "height:9px" }));
    }
    const rows = Object.entries(k).filter(([kk]) => /strategy|learning|candidate|shadow|scan|indicator|reviewed/i.test(kk));
    bd.append(rows.length ? kvTable(rows) : el("div", { class: "empty" }, "No strategy-quality fields published."));
    g.append(panel(p.label, bd));
  }
  box.append(g);
  const strategyEvents = d.events.events.filter((e) => H.EVENT_FILTERS.find((f) => f.id === "strategy").test(e));
  box.append(panel("Strategy-related events", strategyEvents.length ? eventsList(strategyEvents) : el("div", { class: "empty" }, "No strategy-related events in the current window.")));
  return box;
}

function eventsTab(d) {
  const box = el("div", {});
  const chips = el("div", { class: "chips" });
  for (const f of H.EVENT_FILTERS) {
    chips.append(el("button", { class: "chip", type: "button", "aria-pressed": String(f.id === evFilter), onclick: () => { evFilter = f.id; render(); } }, f.label));
  }
  box.append(chips);
  const f = H.EVENT_FILTERS.find((x) => x.id === evFilter);
  const list = d.events.events.filter(f.test);
  box.append(panel(`Events · ${list.length} of ${d.events.events.length}`,
    list.length ? eventsList(list) : el("div", { class: "empty" }, "No recent trading intelligence events found.")));
  return box;
}

function eventsList(list) {
  if (!list.length) return el("div", { class: "empty" }, "No recent trading intelligence events found.");
  const box = el("div", {});
  for (const e of list) {
    const sev = H.eventSeverity(e);
    box.append(el("div", { class: "evrow" },
      el("span", { class: `mk ${H.sevRail(sev)}` }),
      el("span", { class: "t" }, H.relTime(e.occurredAt)),
      el("div", {},
        el("div", { class: "ttl" }, e.title),
        el("div", { class: "sm" }, e.summary),
        el("div", { class: "tags" },
          el("span", { class: `tag ${e.sourceProject === "investing-system" ? "inv" : "kha"}` }, H.projectShort(e.sourceProject)),
          el("span", { class: `badge ${H.toneClass(H.sevTone(sev))}`, html: `${H.ICON[H.sevTone(sev)]}<span>${sev}</span>` }),
          el("span", { class: "tag mono" }, e.type),
          e.instrument ? el("span", { class: "tag mono" }, e.instrument) : null,
          ...Object.keys(e.links || {}).map((k) => el("a", { class: "tag mono", href: "#", title: e.links[k], onclick: (ev) => ev.preventDefault() }, k))
        ))));
  }
  return box;
}

function controlsTab(d) {
  const box = el("div", {});
  box.append(el("div", { class: "safety-banner", style: "margin-bottom:12px", html:
    `${H.ICON.lock}<span>${d.controls.safety.note} Preview runs first; execute is a second, separate request.</span>` }));
  for (const proj of d.controls.projects) {
    const bd = el("div", {});
    if (!proj.available) {
      bd.append(el("div", { class: "empty", style: "text-align:left" }, `Source unavailable — ${proj.error}. No controls can be proxied for this project right now.`));
    } else if (!proj.controls.length) {
      bd.append(el("div", { class: "empty" }, "No controls are available from this project right now."));
    } else {
      const g = el("div", { class: "ctlgrid" });
      for (const c of proj.controls) {
        const risk = H.riskLevel(c);
        g.append(el("div", { class: `ctl risk-${H.riskTone(risk)}` },
          el("div", { style: "display:flex;align-items:center;gap:7px;flex-wrap:wrap" },
            el("span", { class: `badge ${H.toneClass(H.riskTone(risk))}`, html: `${H.ICON[H.riskTone(risk)]}<span>${risk}</span>` }),
            c.requiresServiceRestart ? el("span", { class: "tag" }, "restart") : null,
            c.execution ? el("span", { class: "tag mono" }, c.execution) : null),
          el("div", { class: "lab" }, c.label),
          el("div", { class: "it" }, c.intent || ""),
          el("code", { class: "mono", style: "color:var(--ink-muted)" }, c.namespacedId),
          el("button", { class: `btn ${risk === "low" ? "" : "btn-danger"}`, type: "button", style: "align-self:flex-start",
            onclick: () => openControlDialog(c, (ctl, res) => { log.unshift({ ctl, res }); render(); }) }, "Preview…")));
      }
      bd.append(g);
    }
    box.append(panel(`${proj.label} controls`, bd));
    box.append(el("div", { style: "height:12px" }));
  }
  if (log.length) {
    const t = el("table", { class: "data" }, el("thead", {}, el("tr", {}, el("th", {}, "Action"), el("th", {}, "Status"), el("th", {}, "HTTP"), el("th", {}, "When"))));
    const tb = el("tbody", {});
    for (const r of log.slice(0, 8)) {
      const ok = H.executionSucceeded(r.res);
      tb.append(el("tr", {}, el("td", { class: "mono" }, r.ctl.namespacedId),
        el("td", {}, el("span", { class: `badge ${H.toneClass(ok ? "ready" : "blocked")}`, html: `${ok ? H.ICON.ready : H.ICON.blocked}<span>${r.res.status}</span>` })),
        el("td", { class: "n" }, String(r.res.httpStatus)), el("td", {}, H.relTime(r.res.generatedAt))));
    }
    t.append(tb);
    box.append(panel("This session's control requests", t));
  }
  return box;
}

function skeleton() {
  const b = el("div", {});
  b.append(el("div", { class: "sk", style: "height:44px;width:320px;margin:14px 0" }));
  const r = el("div", { class: "ribbon" });
  for (let i = 0; i < 8; i++) r.append(el("div", { class: "kpi" }, el("div", { class: "sk", style: "height:10px;width:70%" }), el("div", { class: "sk", style: "height:20px;width:52%;margin-top:6px" })));
  b.append(r);
  const g = el("div", { class: "grid2" });
  for (let i = 0; i < 2; i++) g.append(el("div", { class: "card" }, el("div", { class: "bd" }, el("div", { class: "sk", style: "height:132px" }))));
  b.append(g);
  b.append(el("div", { class: "card" }, el("div", { class: "bd" }, el("div", { class: "sk", style: "height:180px" }))));
  return b;
}

function errorShell(msg) {
  return el("div", { style: "padding:44px 0" },
    el("div", { class: "card" }, el("div", { class: "bd", style: "text-align:center;padding:36px 20px" },
      el("div", { class: "badge t-blocked", style: "margin-bottom:10px", html: `${H.ICON.blocked}<span>summary unavailable</span>` }),
      el("h2", { style: "margin:0 0 6px;font-size:17px" }, "Trading intelligence summary is unavailable."),
      el("p", { style: "margin:0 0 14px;color:var(--ink-2);font-size:12.5px" },
        "The dashboard shell is intact. Events and controls may still load — the fleet rollup did not."),
      el("code", { class: "mono", style: "display:block;margin-bottom:14px;color:var(--critical-ink)" }, msg),
      el("button", { class: "btn btn-primary", type: "button", onclick: () => { state = "ready"; render(); } }, "Retry"))));
}

render();
setInterval(() => { if (state === "ready") { const st = document.querySelector(".stamp"); if (st) st.textContent = st.textContent.replace(/Last updated .*? ·/, `Last updated ${H.relTime(TI.summary.generatedAt)} ·`); } }, 15000);
</script>
</body>
</html>
