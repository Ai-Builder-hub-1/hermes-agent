name: Hermes Tier 3 Dashboard Gates

on:
  pull_request:
    paths:
      - ".hermes-dashboard.json"
      - "hermes.dashboards.json"
      - "src/**"
      - "public/**"
      - "docs/design/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tier3-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npx playwright install chromium

      - name: Package-native surface validation
        run: npm run dashboard:package-native:surface:validate -- --project-dir .

      - name: Dashboard creation gate
        run: npm run dashboard:creation-gate -- --project-dir .

      - name: Playwright proof tests
        run: npm test

      - name: Tier 3 score
        run: npm run dashboard:tier3:score -- --project-dir . --strict true --minimum 80

      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-tier3-proof
          path: |
            proof/**
            test-results/**
          if-no-files-found: ignore
          retention-days: 14
