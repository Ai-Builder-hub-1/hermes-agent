schemaVersion: 1
generatedAt: "2026-07-30"
decisions:
  - id: "decision-001"
    status: "recommended"
    title: "Use Kashi VC Market Intelligence as first full reference migration"
    rationale: "It exposes live data freshness, chart quality, pagination, taxonomy, proof endpoint, and drilldown problems in one surface."
    evidence:
      - "docs/design/kaoshi-experience-architecture-comparison.md"
      - "packages/hermes-dashboard-kit/adoption/registry.json"
  - id: "decision-002"
    status: "accepted-by-plan"
    title: "Keep advanced capability modules deferred until V1-V7 proof exists"
    rationale: "Advanced visuals should not hide missing data, state, proof, or governance contracts."
  - id: "decision-003"
    status: "accepted-by-v6"
    title: "Where should full experience contract validation run?"
    options:
      - "central Nous Hermes Agent validation only"
      - "central validation plus downstream project CI"
      - "Hermes OS governance route plus local validation"
    recommendedOption: "central validation plus downstream project CI"
    acceptedOption: "central validation now; downstream CI adoption during V7"
  - id: "decision-004"
    status: "accepted-by-v6"
    title: "Require dashboard admission gates before production redesigns"
    rationale: "Owner, reviewer, recipe, contract, proof, quality, and exception metadata prevent projects from silently drifting away from the shared dashboard system."
    evidence:
      - "docs/design/dashboard-governance-and-enforcement.md"
      - "experience-audit/governance-gates.yaml"
      - "scripts/validate-dashboard-governance.mjs"
risks:
  - id: "risk-001"
    title: "Projects may look adopted while still using static local approximations"
    mitigation: "Require package-native migration plans and proof routes for priority dashboards."
  - id: "risk-002"
    title: "Charts may be technically present but not decision-grade"
    mitigation: "Add visualization intent matrix and visual QA scoring beyond generic render checks."
  - id: "risk-003"
    title: "Production proof may be blocked by auth"
    mitigation: "Use readonly token-protected proof endpoints instead of interactive credentials."
