schemaVersion: 1
generatedAt: "2026-07-31"
purpose: "Data contract for the architecture health dashboard."
owner: "Nous Hermes Agent"
refreshCadence: "on validation run and release review"
widgets:
  - id: "standards-maturity"
    title: "Standards Maturity"
    dataSource: "experience-audit/standards-maturity.yaml"
    metric: "currentMaturity by architecture class"
    target: "all classes at level 4 before broad production migration is considered governed"
  - id: "open-gaps"
    title: "Open Architecture Gaps"
    dataSource: "experience-audit/product-architecture-gap-register.yaml"
    metric: "open gaps by severity and standard"
    target: "no high-severity open gaps without owner and acceptance evidence"
  - id: "adoption-clusters"
    title: "Priority Adoption"
    dataSource: "experience-audit/product-architecture-adoption-plan.yaml"
    metric: "cluster status and next evidence"
    target: "priority clusters pass governance and proof checks"
  - id: "proof-status"
    title: "Production Proof"
    dataSource: "docs/design/dashboard-production-proof-registry.json"
    metric: "proof entries by status"
    target: "all production dashboards baseline-present or explicitly excepted"
  - id: "exceptions"
    title: "Exceptions"
    dataSource: "experience-audit/governance-gates.yaml"
    metric: "exceptions by expiration date"
    target: "zero expired exceptions"
  - id: "visual-quality"
    title: "Visual Quality"
    dataSource: "docs/design/dashboard-visual-quality-report.json"
    metric: "visual score by surface"
    target: "score >= 90 for governed production dashboards"
  - id: "ai-readiness"
    title: "AI Build Readiness"
    dataSource: "docs/design/product-architecture-ai-instruction-pack.md"
    metric: "preflight/postflight coverage"
    target: "AI agents have loaded standards before shared changes"
