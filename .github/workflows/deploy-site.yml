name: Deploy Site

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - "website/**"
      - "skills/**"
      - "optional-skills/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref or SHA to deploy through the private Hetzner rail
        required: false
        default: codex/design-intelligence-standards
        type: string
      service:
        description: Hermes deploy service key
        required: false
        default: nous-hermes-agent
        type: string
      skills_index_run_id:
        description: Optional public-docs skills-index artifact run ID
        required: false
        type: string
      rebuild_skills_index:
        description: Force a fresh public-docs skills index crawl
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  deployments: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.repository == 'NousResearch/hermes-agent' && 'pages' || 'nous-hermes-agent-production' }}
  cancel-in-progress: false

jobs:
  deploy-hetzner:
    if: github.repository == 'Ai-Builder-hub-1/hermes-agent' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_REF: ${{ github.event.inputs.ref || github.sha }}
      HERMES_SERVICE_KEY: ${{ github.event.inputs.service || vars.HERMES_SERVICE_KEY || 'nous-hermes-agent' }}
      HETZNER_HOST: ${{ secrets.HETZNER_HOST || secrets.PRODUCTION_HOST }}
      HETZNER_USER: ${{ secrets.HETZNER_USER || secrets.PRODUCTION_USER }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY || secrets.PRODUCTION_SSH_KEY }}
      HETZNER_SSH_PORT: ${{ secrets.HETZNER_SSH_PORT || secrets.PRODUCTION_SSH_PORT }}
      HETZNER_PROMOTE_SCRIPT: ${{ vars.HETZNER_PROMOTE_SCRIPT || '/root/apps/deploy/scripts/promote-service.sh' }}
      PRODUCTION_BASE_DOMAIN: ${{ secrets.PRODUCTION_BASE_DOMAIN || vars.PRODUCTION_BASE_DOMAIN || secrets.HERMES_PRODUCTION_BASE_DOMAIN || vars.HERMES_PRODUCTION_BASE_DOMAIN }}
      PRODUCTION_URL: ${{ secrets.PRODUCTION_URL || vars.PRODUCTION_URL }}
      HERMES_AGENT_DASHBOARD_USERNAME: ${{ secrets.HERMES_AGENT_DASHBOARD_USERNAME }}
      HERMES_AGENT_DASHBOARD_PASSWORD: ${{ secrets.HERMES_AGENT_DASHBOARD_PASSWORD }}
      HERMES_DASHBOARD_PROOF_TOKEN: ${{ secrets.HERMES_DASHBOARD_PROOF_TOKEN }}
    steps:
      - name: Checkout deployment metadata
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_REF }}

      - name: Validate production deploy inputs
        run: |
          missing=()
          for name in HETZNER_HOST HETZNER_USER HETZNER_SSH_KEY; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ -z "$PRODUCTION_URL" ] && [ -z "$PRODUCTION_BASE_DOMAIN" ]; then
            missing+=("PRODUCTION_BASE_DOMAIN or PRODUCTION_URL")
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::notice::Skipping production deploy because required repository secrets or variables are missing: ${missing[*]}"
            echo "Add shared Hetzner secrets and PRODUCTION_BASE_DOMAIN in GitHub repository Settings > Secrets and variables > Actions."
            echo "DEPLOY_READY=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "DEPLOY_READY=true" >> "$GITHUB_ENV"

      - name: Resolve production target
        if: env.DEPLOY_READY == 'true'
        run: node .github/scripts/resolve-production-target.mjs

      - name: Validate resolved production target
        if: env.DEPLOY_READY == 'true'
        run: |
          missing=()
          for name in PRODUCTION_URL PRODUCTION_HEALTH_URL HERMES_SERVICE_KEY; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Production target resolution did not produce required values: ${missing[*]}"
            exit 1
          fi

      - name: Prepare SSH
        if: env.DEPLOY_READY == 'true'
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" > ~/.ssh/hermes_deploy
          chmod 600 ~/.ssh/hermes_deploy
          ssh-keyscan -p "${HETZNER_SSH_PORT:-22}" "$HETZNER_HOST" >> ~/.ssh/known_hosts

      - name: Promote service through shared Hetzner deploy rail
        if: env.DEPLOY_READY == 'true'
        run: |
          ssh -i ~/.ssh/hermes_deploy -p "${HETZNER_SSH_PORT:-22}" "$HETZNER_USER@$HETZNER_HOST" \
            "export HERMES_DASHBOARD_PROOF_TOKEN='$HERMES_DASHBOARD_PROOF_TOKEN' HERMES_AGENT_DASHBOARD_USERNAME='$HERMES_AGENT_DASHBOARD_USERNAME' HERMES_AGENT_DASHBOARD_PASSWORD='$HERMES_AGENT_DASHBOARD_PASSWORD'; if [ -d \"\$HOME/apps/nous-hermes-agent/.git\" ]; then cd \"\$HOME/apps/nous-hermes-agent\" && git stash push --include-untracked -m \"pre-deploy-$DEPLOY_REF\" || true; fi; '$HETZNER_PROMOTE_SCRIPT' '$HERMES_SERVICE_KEY' '$DEPLOY_REF'"

      - name: Verify production health
        if: env.DEPLOY_READY == 'true'
        run: |
          for attempt in $(seq 1 80); do
            body="$(curl --silent --show-error --max-time 20 "$PRODUCTION_HEALTH_URL" || true)"
            if printf '%s' "$body" | grep -Eq '"status":"ready"|"auth_required":true|"ok":true'; then
              printf '%s\n' "$body"
              exit 0
            fi
            echo "Production health not ready yet (attempt $attempt/80): $body"
            sleep 3
          done
          echo "::error::Production did not become ready within the health-check window."
          exit 1

      - name: Record GitHub deployment
        if: env.DEPLOY_READY == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const ref = process.env.DEPLOY_REF;
            const productionUrl = process.env.PRODUCTION_URL;
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref,
              environment: 'production',
              required_contexts: [],
              auto_merge: false,
              description: `Production deployment: ${productionUrl}`,
            });

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              environment: 'production',
              environment_url: productionUrl,
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: 'Production deployment completed.',
            });

      - name: Report skipped deployment
        if: env.DEPLOY_READY != 'true'
        run: |
          echo "Production deployment was skipped because deploy secrets are not configured."

  deploy-docs:
    if: github.repository == 'NousResearch/hermes-agent'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"

      - name: Install PyYAML for skill extraction
        run: pip install pyyaml==6.0.2 httpx==0.28.1

      - name: Prepare skills index (unified multi-source catalog)
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          SKILLS_INDEX_RUN_ID: ${{ github.event.inputs.skills_index_run_id || '' }}
          REBUILD_SKILLS_INDEX: ${{ github.event.inputs.rebuild_skills_index || 'false' }}
        run: |
          set -euo pipefail
          INDEX_PATH="website/static/api/skills-index.json"
          mkdir -p "$(dirname "$INDEX_PATH")"

          validate_index() {
            python3 - "$INDEX_PATH" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          try:
              data = json.loads(path.read_text(encoding="utf-8"))
          except Exception as exc:
              print(f"invalid skills index JSON: {exc}", file=sys.stderr)
              sys.exit(1)
          skills = data.get("skills")
          if not isinstance(skills, list) or len(skills) < 1500:
              count = len(skills) if isinstance(skills, list) else "missing"
              print(f"skills index too small: {count}", file=sys.stderr)
              sys.exit(1)
          print(f"skills index ready: {len(skills)} skills")
          PY
          }

          if [ "$REBUILD_SKILLS_INDEX" = "true" ]; then
            python3 scripts/build_skills_index.py
            validate_index
            exit 0
          fi

          if [ -n "$SKILLS_INDEX_RUN_ID" ]; then
            tmpdir="$(mktemp -d)"
            echo "Downloading skills-index artifact from run $SKILLS_INDEX_RUN_ID"
            if gh run download "$SKILLS_INDEX_RUN_ID" --name skills-index --dir "$tmpdir"; then
              candidate="$(find "$tmpdir" -name skills-index.json -type f | head -n 1 || true)"
              if [ -n "$candidate" ]; then
                cp "$candidate" "$INDEX_PATH"
                if validate_index; then
                  exit 0
                fi
              fi
            fi
            echo "::warning::Could not use skills-index artifact from run $SKILLS_INDEX_RUN_ID; trying live index"
          fi

          echo "Downloading currently live skills index"
          if curl -fsSL --retry 3 --retry-delay 5 \
            "https://hermes-agent.nousresearch.com/docs/api/skills-index.json" \
            -o "$INDEX_PATH" && validate_index; then
            exit 0
          fi

          echo "::warning::Live skills index unavailable or unhealthy; falling back to a fresh crawl"
          rm -f "$INDEX_PATH"
          python3 scripts/build_skills_index.py
          validate_index

      - name: Extract skill metadata for dashboard
        run: python3 website/scripts/extract-skills.py

      - name: Regenerate per-skill docs pages + catalogs
        run: python3 website/scripts/generate-skill-docs.py

      - name: Install dependencies
        run: npm ci
        working-directory: website

      - name: Build Docusaurus
        run: npm run build
        working-directory: website

      - name: Stage deployment
        run: |
          mkdir -p _site/docs
          cp -r website/build/* _site/docs/
          if [ -f website/build/llms.txt ]; then
            cp website/build/llms.txt _site/llms.txt
          fi
          if [ -f website/build/llms-full.txt ]; then
            cp website/build/llms-full.txt _site/llms-full.txt
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
